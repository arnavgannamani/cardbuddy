# Render Blueprint for the hosted CardBuddy demo: dry run (PayPal is never called), open pages with no password (cards
# can't be removed), and the agent's API key generated by Render. The public address comes from RENDER_EXTERNAL_URL.
services:
  - type: web
    name: cardbuddy
    runtime: node
    plan: free
    buildCommand: echo "No build step"
    startCommand: node server.mjs
    healthCheckPath: /login
    envVars:
      - key: CARDBUDDY_DRY_RUN
        value: "1"
      - key: CARDBUDDY_KEY
        generateValue: true
