<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; form-action 'self'; base-uri 'none'">
  <title>Sign in · CardBuddy</title>
  <link rel="icon" href="/mark.svg">
  <link rel="stylesheet" href="/app.css">
  <style>
    main { max-width: 420px; }
    form button { width: 100%; height: 40px; margin-top: 18px; }
    .wrong { color: var(--muted); font-size: 13.5px; margin: 12px 0 0; }
  </style>
</head>
<body>
  <header class="top"><div class="in">
    <a class="brand" href="/" aria-label="CardBuddy by PointMaxx"><img src="/mark.svg" alt=""><b>CardBuddy</b><span>by PointMaxx</span></a>
    <div class="env"><i></i>PayPal sandbox</div>
  </div></header>
  <main>
    <h1>Sign in</h1>
    <div class="panel"><div class="pb">
      <form method="post" action="/login">
        <input type="hidden" name="next" value="__NEXT__">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
        __WRONG__
        <button type="submit">Sign in</button>
      </form>
    </div></div>
  </main>
</body>
</html>
